name: Update GitHub stats cards

on:
  schedule:
    # Daily, just after midnight Eastern, so the streak card counts the day that just ended.
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run script tests
        run: node --test scripts/update-cards.test.js

      - name: Regenerate cards
        env:
          GH_TOKEN: ${{ secrets.LANGUAGES_TOKEN }}
        run: node scripts/update-cards.js

      - name: Commit and push if the numbers changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || (git commit -m "Update GitHub stats cards" && git push)
