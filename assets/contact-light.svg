<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Have a project in mind? Email info@nicoscript.com">
  <title>Get in touch</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F6F6"/>
      <stop offset="1" stop-color="#EEEEEE"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#484848"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A1A1A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1A1A1A" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#1A1A1A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6F6F6"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="218" rx="22"/></clipPath>
  </defs>
  <style>
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes draw { from { stroke-dashoffset: 1; } }
    @keyframes sweep { 0% { stroke-dasharray: 0 100; opacity: 0; } 8% { opacity: 1; } }
    @keyframes grow { from { transform: scaleY(0); } }
    @keyframes pop { 0% { opacity: 0; transform: scale(0); } 70% { transform: scale(1.3); } }
    @keyframes pulse { 50% { opacity: 0.45; } }
    .rise, .tile, .building, .goal, .repo { animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .fade, .segment, .hour { animation: fade 0.6s ease-out both; }
    .line { animation: draw 1.8s cubic-bezier(0.45, 0, 0.2, 1) both; }
    .progress { animation: sweep 1.5s cubic-bezier(0.45, 0, 0.2, 1) 0.3s both; }
    .day { transform-box: fill-box; transform-origin: bottom; animation: grow 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.5s ease-out both; }
    .pulse { animation: pulse 2.4s ease-in-out 2s infinite; }
    @keyframes beam { 70%, 100% { transform: translateX(1700px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.75; } }
    .beam { animation: beam 8s ease-in-out 2.4s infinite; }
    .hand { transform-box: view-box; transform-origin: 210px 216px; animation: spin 10s linear infinite; }
    .glow { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes shine-s { 30%, 100% { transform: translateX(290px); } }
    @keyframes shine-m { 25%, 100% { transform: translateX(860px); } }
    @keyframes shine-l { 25%, 100% { transform: translateX(1680px); } }
    @keyframes nudge { 0%, 60%, 100% { transform: translateX(0); } 70% { transform: translateX(5px); } 80% { transform: translateX(0); } 90% { transform: translateX(3px); } }
    @keyframes ping { 0% { opacity: 0.7; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(2.8); } }
    @keyframes spot { 0%, 100% { opacity: 0; } 8% { opacity: 1; } 22% { opacity: 0; } }
    @keyframes float { 50% { transform: translateY(-10px); } }
    .shine-s { animation: shine-s 6s ease-in-out infinite both; }
    .shine-m { animation: shine-m 11s ease-in-out infinite both; }
    .shine-l { animation: shine-l 10s ease-in-out infinite both; }
    .nudge { animation: nudge 3.5s ease-in-out 2s infinite; }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out infinite; }
    .spot { animation: spot 9s ease-in-out infinite; }
    .float { animation: float 8s ease-in-out infinite; }
    .spin { transform-box: view-box; animation: spin 16s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .hand, .comet, .beam { display: none; } .travel, .spin, .ping, .spot { display: none; } * { animation: none !important; } }
  </style>
  <rect x="1" y="1" width="1198" height="218" rx="22" fill="url(#panel)" stroke="#D0D0D0" stroke-width="2"/>
  <circle cx="52" cy="62" r="4.5" fill="#1A1A1A"/>
  <circle class="ping" style="animation-delay:1200ms" cx="52" cy="62" r="4.5" fill="none" stroke="#1A1A1A" stroke-width="1.5" opacity="0"/>
  <text class="fade" x="68" y="67" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#595959">LET&#39;S WORK TOGETHER</text>
  <text class="rise" style="animation-delay:150ms" x="44" y="122" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="url(#num)">Have a project in mind?</text>
  <text class="rise" style="animation-delay:300ms" x="44" y="160" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#484848">I design and build web apps end to end. Tell me what you&#39;re working on.</text>
  <g class="rise" style="animation-delay:450ms">
    <rect x="812" y="82" width="344" height="56" rx="28" fill="#1A1A1A"/>
    <g transform="translate(838 98) scale(1)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22 6 12 13 2 6"/></g>
    <text x="874" y="117" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">info@nicoscript.com</text>
    <text class="nudge" x="1130" y="117" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">→</text>
  </g>
  <g clip-path="url(#frame)"><g class="shine-l" style="animation-delay:2200ms"><rect x="-300" y="0" width="300" height="220" fill="url(#sheen)" transform="skewX(-20)"/></g></g>
</svg>
