  <circle class="segment" style="animation-delay:290ms" cx="124" cy="182" r="60" fill="none" stroke="#E5E5E5" stroke-width="20" pathLength="100" stroke-dasharray="15.34 84.66" stroke-dashoffset="-63.07" transform="rotate(-90 124 182)"/>
  <circle class="segment" style="animation-delay:430ms" cx="124" cy="182" r="60" fill="none" stroke="#D1D1D1" stroke-width="20" pathLength="100" stroke-dasharray="5.45 94.55" stroke-dashoffset="-79.42" transform="rotate(-90 124 182)"/>
  <circle class="segment" style="animation-delay:570ms" cx="124" cy="182" r="60" fill="none" stroke="#B4B4B4" stroke-width="20" pathLength="100" stroke-dasharray="3.37 96.63" stroke-dashoffset="-85.87" transform="rotate(-90 124 182)"/>
  <circle class="segment" style="animation-delay:710ms" cx="124" cy="182" r="60" fill="none" stroke="#A1A1A1" stroke-width="20" pathLength="100" stroke-dasharray="3.14 96.86" stroke-dashoffset="-90.24" transform="rotate(-90 124 182)"/>
  <circle class="segment" style="animation-delay:850ms" cx="124" cy="182" r="60" fill="none" stroke="#6E6E6E" stroke-width="20" pathLength="100" stroke-dasharray="4.61 95.39" stroke-dashoffset="-94.39" transform="rotate(-90 124 182)"/>
  <text class="pop" style="animation-delay:1200ms" x="124" y="188" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="url(#num)">63%</text>
  <text class="fade" style="animation-delay:1300ms" x="124" y="206" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8E8E8E">TypeScript</text>
  <g class="rise" style="animation-delay:200ms">
