  </g>
  <g class="rise" style="animation-delay:470ms">
    <rect class="swatch" x="240" y="226" width="11" height="11" rx="3" fill="#B4B4B4"/>
    <text x="259" y="236" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#D1D1D1">PLpgSQL <tspan fill="#8E8E8E">4.4%</tspan></text>
  </g>
  <g class="rise" style="animation-delay:560ms">
    <rect class="swatch" x="408" y="124" width="11" height="11" rx="3" fill="#A1A1A1"/>
    <text x="427" y="134" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#D1D1D1">HTML <tspan fill="#8E8E8E">4.1%</tspan></text>
  </g>
