    <text x="259" y="168" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#D1D1D1">JavaScript <tspan fill="#8E8E8E">16.3%</tspan></text>
  </g>
  <g class="rise" style="animation-delay:380ms">
    <rect class="swatch" x="240" y="192" width="11" height="11" rx="3" fill="#D1D1D1"/>
