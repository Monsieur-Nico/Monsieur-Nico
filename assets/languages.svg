<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 590 274" width="590" height="274" role="img" aria-label="Most used languages: TypeScript 63.1%, JavaScript 16.3%, Python 6.5%, PLpgSQL 4.4%, HTML 4.1%, Lua 2.2%, CSS 2.1%, Shell 1.3%">
  <title>Most used languages</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A1A1A1"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <style>
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes draw { from { stroke-dashoffset: 1; } }
    @keyframes sweep { 0% { stroke-dasharray: 0 100; opacity: 0; } 8% { opacity: 1; } }
    @keyframes grow { from { transform: scaleY(0); } }
    @keyframes pop { 0% { opacity: 0; transform: scale(0); } 70% { transform: scale(1.3); } }
    @keyframes pulse { 50% { opacity: 0.45; } }
    .rise, .tile, .building { animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .fade, .segment, .hour { animation: fade 0.6s ease-out both; }
    .line { animation: draw 1.8s cubic-bezier(0.45, 0, 0.2, 1) both; }
    .progress { animation: sweep 1.5s cubic-bezier(0.45, 0, 0.2, 1) 0.3s both; }
    .day { transform-box: fill-box; transform-origin: bottom; animation: grow 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.5s ease-out both; }
    .pulse { animation: pulse 2.4s ease-in-out 2s infinite; }
    @keyframes beam { 70%, 100% { transform: translateX(1700px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.75; } }
    .beam { animation: beam 8s ease-in-out 2.4s infinite; }
    .hand { transform-box: view-box; transform-origin: 210px 216px; animation: spin 10s linear infinite; }
    .glow { animation: breathe 3.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .hand, .comet, .beam { display: none; } * { animation: none !important; } }
  </style>
  <rect x="1" y="1" width="588" height="272" rx="20" fill="url(#card)" stroke="#3A3A3A" stroke-width="2"/>
  <rect x="28" y="28" width="46" height="46" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#3A3A3A"/>
  <g transform="translate(39 39) scale(1)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></g>
  <text x="90" y="49" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Most used languages</text>
  <text x="90" y="68" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#8E8E8E">BY CODE SIZE</text>
  <line x1="28" x2="562" y1="92" y2="92" stroke="#ffffff" stroke-opacity="0.08"/>
