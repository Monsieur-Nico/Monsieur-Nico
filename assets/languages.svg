    <rect class="swatch" x="408" y="158" width="11" height="11" rx="3" fill="#6E6E6E"/>
    <text x="427" y="168" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#D1D1D1">Lua <tspan fill="#8E8E8E">2.2%</tspan></text>
