    <rect class="swatch" x="408" y="192" width="11" height="11" rx="3" fill="#6E6E6E"/>
    <text x="427" y="202" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#D1D1D1">CSS <tspan fill="#8E8E8E">2.1%</tspan></text>
  </g>
  <g class="rise" style="animation-delay:830ms">
