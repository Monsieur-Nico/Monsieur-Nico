    <text x="96" y="169" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" fill="#313131">Go deeper on API security and AI-driven automation pipelines</text>
    <circle cx="1144" cy="163" r="9" fill="none" stroke="#A3A3A3" stroke-width="2"/>
  </g>
  <rect class="spot" style="animation-delay:4200ms" x="28" y="140" width="1144" height="46" rx="14" fill="#1A1A1A" fill-opacity="0.04" stroke="#1A1A1A" stroke-opacity="0.5" opacity="0"/>
  <g class="goal" style="animation-delay:510ms">
    <rect x="28" y="198" width="1144" height="46" rx="14" fill="#1A1A1A" fill-opacity="0.03" stroke="#D0D0D0"/>
    <text x="52" y="228" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="url(#num)">04</text>
    <text x="96" y="227" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" fill="#313131">Grow NicoScript&#39;s client base and my personal brand</text>
    <circle cx="1144" cy="221" r="9" fill="none" stroke="#A3A3A3" stroke-width="2"/>
  </g>
  <rect class="spot" style="animation-delay:5100ms" x="28" y="198" width="1144" height="46" rx="14" fill="#1A1A1A" fill-opacity="0.04" stroke="#1A1A1A" stroke-opacity="0.5" opacity="0"/>
