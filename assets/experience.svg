<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 356" width="1200" height="356" role="img" aria-label="Experience. 2022 – Present: Owner &amp; Developer, NicoScript. Design and build custom web apps, UI/UX, and performance-tuned sites for clients. 50+ projects shipped. 2021 – 2022: Web Developer, Lighthouse Labs. Completed a 12-week intensive full-stack program covering data modelling, testing, and software architecture. 2019 – 2022: Owner &amp; Developer, Rok Commander. Built and ran a Discord bot that grew to 2.7M+ users. Owned support, roadmap, and UX end to end.">
  <title>Experience</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A1A1A1"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0C0C"/>
      <stop offset="1" stop-color="#1A1A1A"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes draw { from { stroke-dashoffset: 1; } }
    @keyframes sweep { 0% { stroke-dasharray: 0 100; opacity: 0; } 8% { opacity: 1; } }
    @keyframes grow { from { transform: scaleY(0); } }
    @keyframes pop { 0% { opacity: 0; transform: scale(0); } 70% { transform: scale(1.3); } }
    @keyframes pulse { 50% { opacity: 0.45; } }
    .rise, .tile, .building, .goal, .repo { animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .fade, .segment, .hour { animation: fade 0.6s ease-out both; }
    .line { animation: draw 1.8s cubic-bezier(0.45, 0, 0.2, 1) both; }
    .progress { animation: sweep 1.5s cubic-bezier(0.45, 0, 0.2, 1) 0.3s both; }
    .day { transform-box: fill-box; transform-origin: bottom; animation: grow 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.5s ease-out both; }
    .pulse { animation: pulse 2.4s ease-in-out 2s infinite; }
    @keyframes beam { 70%, 100% { transform: translateX(1700px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.75; } }
    .beam { animation: beam 8s ease-in-out 2.4s infinite; }
    .hand { transform-box: view-box; transform-origin: 210px 216px; animation: spin 10s linear infinite; }
    .glow { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes shine-s { 30%, 100% { transform: translateX(290px); } }
    @keyframes shine-m { 25%, 100% { transform: translateX(860px); } }
    @keyframes shine-l { 25%, 100% { transform: translateX(1680px); } }
    @keyframes nudge { 0%, 60%, 100% { transform: translateX(0); } 70% { transform: translateX(5px); } 80% { transform: translateX(0); } 90% { transform: translateX(3px); } }
    @keyframes ping { 0% { opacity: 0.7; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(2.8); } }
    @keyframes spot { 0%, 100% { opacity: 0; } 8% { opacity: 1; } 22% { opacity: 0; } }
    @keyframes float { 50% { transform: translateY(-10px); } }
    .shine-s { animation: shine-s 6s ease-in-out infinite both; }
    .shine-m { animation: shine-m 11s ease-in-out infinite both; }
    .shine-l { animation: shine-l 10s ease-in-out infinite both; }
    .nudge { animation: nudge 3.5s ease-in-out 2s infinite; }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out infinite; }
    .spot { animation: spot 9s ease-in-out infinite; }
    .float { animation: float 8s ease-in-out infinite; }
    .spin { transform-box: view-box; animation: spin 16s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .hand, .comet, .beam { display: none; } .travel, .spin, .ping, .spot { display: none; } * { animation: none !important; } }
  </style>
  <rect x="1" y="1" width="1198" height="354" rx="22" fill="url(#panel)" stroke="#3A3A3A" stroke-width="2"/>
  <line class="day" style="transform-origin:top;animation-duration:1.2s" x1="262" y1="42" x2="262" y2="250" stroke="#484848" stroke-width="2"/>
  <circle class="travel" cx="262" cy="42" r="9" fill="#FFFFFF" opacity="0"><animate attributeName="cy" values="42;250" dur="3.4s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.18;0.18;0" keyTimes="0;0.15;0.8;1" dur="3.4s" begin="2.2s" repeatCount="indefinite"/></circle>
  <circle class="travel" cx="262" cy="42" r="3.5" fill="#FFFFFF" opacity="0"><animate attributeName="cy" values="42;250" dur="3.4s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="3.4s" begin="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="262" cy="42" r="7" fill="#FFFFFF"/>
  <circle class="ping" style="animation-delay:1600ms" cx="262" cy="42" r="7" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0"/>
  <g class="rise" style="animation-delay:250ms">
    <text x="48" y="48" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2022 – Present</text>
    <text x="296" y="48" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Owner &amp; Developer <tspan fill="#8E8E8E" font-weight="600">·  NicoScript</tspan></text>
    <text x="296" y="76" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#A1A1A1">Design and build custom web apps, UI/UX, and performance-tuned sites</text>
    <text x="296" y="97" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#A1A1A1">for clients. 50+ projects shipped.</text>
  </g>
  <circle cx="262" cy="146" r="6" fill="#1A1A1A" stroke="#8E8E8E" stroke-width="2"/>
  <g class="rise" style="animation-delay:470ms">
    <text x="48" y="152" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#D1D1D1">2021 – 2022</text>
    <text x="296" y="152" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Web Developer <tspan fill="#8E8E8E" font-weight="600">·  Lighthouse Labs</tspan></text>
    <text x="296" y="180" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#A1A1A1">Completed a 12-week intensive full-stack program covering data</text>
    <text x="296" y="201" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#A1A1A1">modelling, testing, and software architecture.</text>
  </g>
  <circle cx="262" cy="250" r="6" fill="#1A1A1A" stroke="#8E8E8E" stroke-width="2"/>
  <g class="rise" style="animation-delay:690ms">
    <text x="48" y="256" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#D1D1D1">2019 – 2022</text>
    <text x="296" y="256" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Owner &amp; Developer <tspan fill="#8E8E8E" font-weight="600">·  Rok Commander</tspan></text>
    <text x="296" y="284" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#A1A1A1">Built and ran a Discord bot that grew to 2.7M+ users. Owned support,</text>
    <text x="296" y="305" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#A1A1A1">roadmap, and UX end to end.</text>
  </g>
</svg>
