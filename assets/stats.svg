<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="2.7M+ Discord bot users, 50+ projects shipped, 4+ yrs running NicoScript, 7 yrs building software">
  <title>Nicolas Alkhoury by the numbers</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A1A1A1"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes draw { from { stroke-dashoffset: 1; } }
    @keyframes sweep { 0% { stroke-dasharray: 0 100; opacity: 0; } 8% { opacity: 1; } }
    @keyframes grow { from { transform: scaleY(0); } }
    @keyframes pop { 0% { opacity: 0; transform: scale(0); } 70% { transform: scale(1.3); } }
    @keyframes pulse { 50% { opacity: 0.45; } }
    .rise, .tile, .building, .goal { animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .fade, .segment, .hour { animation: fade 0.6s ease-out both; }
    .line { animation: draw 1.8s cubic-bezier(0.45, 0, 0.2, 1) both; }
    .progress { animation: sweep 1.5s cubic-bezier(0.45, 0, 0.2, 1) 0.3s both; }
    .day { transform-box: fill-box; transform-origin: bottom; animation: grow 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.5s ease-out both; }
    .pulse { animation: pulse 2.4s ease-in-out 2s infinite; }
    @keyframes beam { 70%, 100% { transform: translateX(1700px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.75; } }
    .beam { animation: beam 8s ease-in-out 2.4s infinite; }
    .hand { transform-box: view-box; transform-origin: 210px 216px; animation: spin 10s linear infinite; }
    .glow { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes shine-s { 30%, 100% { transform: translateX(290px); } }
    @keyframes shine-m { 25%, 100% { transform: translateX(860px); } }
    @keyframes shine-l { 25%, 100% { transform: translateX(1680px); } }
    @keyframes nudge { 0%, 60%, 100% { transform: translateX(0); } 70% { transform: translateX(5px); } 80% { transform: translateX(0); } 90% { transform: translateX(3px); } }
    @keyframes ping { 0% { opacity: 0.7; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(2.8); } }
    @keyframes spot { 0%, 100% { opacity: 0; } 8% { opacity: 1; } 22% { opacity: 0; } }
    @keyframes float { 50% { transform: translateY(-10px); } }
    .shine-s { animation: shine-s 6s ease-in-out infinite both; }
    .shine-m { animation: shine-m 11s ease-in-out infinite both; }
    .shine-l { animation: shine-l 10s ease-in-out infinite both; }
    .nudge { animation: nudge 3.5s ease-in-out 2s infinite; }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out infinite; }
    .spot { animation: spot 9s ease-in-out infinite; }
    .float { animation: float 8s ease-in-out infinite; }
    .spin { transform-box: view-box; animation: spin 16s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .hand, .comet, .beam { display: none; } .travel, .spin, .ping, .spot { display: none; } * { animation: none !important; } }
  </style>
  <g class="rise" style="animation-delay:0ms">
    <rect x="1" y="11" width="283" height="148" rx="18" fill="url(#card)" stroke="#3A3A3A" stroke-width="2"/>
    <g transform="translate(131.5 26) scale(0.9166666666666666)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g>
    <text x="142.5" y="92" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="48" font-weight="800" fill="url(#num)">2.7M+</text>
    <text x="142.5" y="128" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#8E8E8E">Discord bot users</text>
  </g>
  <rect class="spot" style="animation-delay:2400ms" x="1" y="11" width="283" height="148" rx="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2" opacity="0"/>
  <g class="rise" style="animation-delay:120ms">
    <rect x="306" y="11" width="283" height="148" rx="18" fill="url(#card)" stroke="#3A3A3A" stroke-width="2"/>
    <g transform="translate(436.5 26) scale(0.9166666666666666)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></g>
    <text x="447.5" y="92" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="48" font-weight="800" fill="url(#num)">50+</text>
    <text x="447.5" y="128" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#8E8E8E">projects shipped</text>
  </g>
  <rect class="spot" style="animation-delay:3300ms" x="306" y="11" width="283" height="148" rx="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2" opacity="0"/>
  <g class="rise" style="animation-delay:240ms">
    <rect x="611" y="11" width="283" height="148" rx="18" fill="url(#card)" stroke="#3A3A3A" stroke-width="2"/>
    <g transform="translate(741.5 26) scale(0.9166666666666666)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></g>
    <text x="752.5" y="92" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="48" font-weight="800" fill="url(#num)">4+ yrs</text>
    <text x="752.5" y="128" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#8E8E8E">running NicoScript</text>
  </g>
  <rect class="spot" style="animation-delay:4200ms" x="611" y="11" width="283" height="148" rx="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2" opacity="0"/>
  <g class="rise" style="animation-delay:360ms">
    <rect x="916" y="11" width="283" height="148" rx="18" fill="url(#card)" stroke="#3A3A3A" stroke-width="2"/>
    <g transform="translate(1046.5 26) scale(0.9166666666666666)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></g>
    <text x="1057.5" y="92" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="48" font-weight="800" fill="url(#num)">7 yrs</text>
    <text x="1057.5" y="128" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#8E8E8E">building software</text>
  </g>
  <rect class="spot" style="animation-delay:5100ms" x="916" y="11" width="283" height="148" rx="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2" opacity="0"/>
</svg>
