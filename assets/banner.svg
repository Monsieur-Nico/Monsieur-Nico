<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Nicolas Alkhoury, Full-Stack Developer and AI Toolmaker based in Ottawa, Canada.">
  <title>Nicolas Alkhoury</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A1A1A1"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0C0C"/>
      <stop offset="0.6" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#333333"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#636363"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3A3A3A"/><stop offset="0.5" stop-color="#D1D1D1"/><stop offset="1" stop-color="#3A3A3A"/></linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/></pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="358" rx="24"/></clipPath>
  </defs>
  <style>
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes draw { from { stroke-dashoffset: 1; } }
    @keyframes sweep { 0% { stroke-dasharray: 0 100; opacity: 0; } 8% { opacity: 1; } }
    @keyframes grow { from { transform: scaleY(0); } }
    @keyframes pop { 0% { opacity: 0; transform: scale(0); } 70% { transform: scale(1.3); } }
    @keyframes pulse { 50% { opacity: 0.45; } }
    .rise, .tile, .building, .goal { animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .fade, .segment, .hour { animation: fade 0.6s ease-out both; }
    .line { animation: draw 1.8s cubic-bezier(0.45, 0, 0.2, 1) both; }
    .progress { animation: sweep 1.5s cubic-bezier(0.45, 0, 0.2, 1) 0.3s both; }
    .day { transform-box: fill-box; transform-origin: bottom; animation: grow 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.5s ease-out both; }
    .pulse { animation: pulse 2.4s ease-in-out 2s infinite; }
    @keyframes beam { 70%, 100% { transform: translateX(1700px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.75; } }
    .beam { animation: beam 8s ease-in-out 2.4s infinite; }
    .hand { transform-box: view-box; transform-origin: 210px 216px; animation: spin 10s linear infinite; }
    .glow { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes shine-s { 30%, 100% { transform: translateX(290px); } }
    @keyframes shine-m { 25%, 100% { transform: translateX(860px); } }
    @keyframes shine-l { 25%, 100% { transform: translateX(1680px); } }
    @keyframes nudge { 0%, 60%, 100% { transform: translateX(0); } 70% { transform: translateX(5px); } 80% { transform: translateX(0); } 90% { transform: translateX(3px); } }
    @keyframes ping { 0% { opacity: 0.7; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(2.8); } }
    @keyframes spot { 0%, 100% { opacity: 0; } 8% { opacity: 1; } 22% { opacity: 0; } }
    @keyframes float { 50% { transform: translateY(-10px); } }
    .shine-s { animation: shine-s 6s ease-in-out infinite both; }
    .shine-m { animation: shine-m 11s ease-in-out infinite both; }
    .shine-l { animation: shine-l 10s ease-in-out infinite both; }
    .nudge { animation: nudge 3.5s ease-in-out 2s infinite; }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out infinite; }
    .spot { animation: spot 9s ease-in-out infinite; }
    .float { animation: float 8s ease-in-out infinite; }
    .spin { transform-box: view-box; animation: spin 16s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .hand, .comet, .beam { display: none; } .travel, .spin, .ping, .spot { display: none; } * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#dots)"/>
    <circle class="float" style="animation-duration:9s" cx="1030" cy="60" r="240" fill="url(#glowA)"/>
    <circle class="float" style="animation-duration:12s;animation-direction:reverse" cx="90" cy="350" r="220" fill="url(#glowB)"/>
    <text class="float" style="animation-duration:14s" x="1150" y="270" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="200" font-weight="800" fill="#ffffff" fill-opacity="0.045">&lt;/&gt;</text>
  </g>
  <circle cx="140" cy="180" r="74" fill="none" stroke="url(#ring)" stroke-width="3"/>
  <circle cx="140" cy="180" r="62" fill="#0C0C0C"/>
  <text class="pop" style="animation-delay:150ms" x="140" y="203" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#num)">N</text>
  <g class="spin" style="transform-origin:140px 180px"><circle cx="140" cy="106" r="10" fill="#FFFFFF" opacity="0.14"/><circle cx="140" cy="106" r="4.5" fill="#F0F0F0"/></g>
  <text class="fade" style="animation-delay:200ms" x="250" y="116" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#8E8E8E">HELLO, I'M</text>
  <text class="rise" style="animation-delay:300ms" x="250" y="180" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="60" font-weight="800" fill="url(#num)">Nicolas Alkhoury</text>
  <text class="rise" style="animation-delay:480ms" x="250" y="224" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="27" font-weight="600" fill="#D1D1D1">Full-Stack Developer • AI Toolmaker</text>
  <text class="rise" style="animation-delay:640ms" x="250" y="264" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#8E8E8E">Web apps end to end — front end, back end, and the AI in between.</text>
  <g class="rise" style="animation-delay:800ms">
    <rect x="250" y="288" width="176" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#636363"/>
    <circle cx="272" cy="305" r="4.5" fill="#D1D1D1"/>
    <circle class="ping" style="animation-delay:2000ms" cx="272" cy="305" r="4.5" fill="none" stroke="#D1D1D1" stroke-width="1.5" opacity="0"/>
    <text x="288" y="310" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#F0F0F0">Ottawa, Canada</text>
  </g>
  <g clip-path="url(#frame)"><g class="shine-l" style="animation-delay:2600ms"><rect x="-300" y="0" width="300" height="360" fill="url(#sheen)" transform="skewX(-20)"/></g></g>
  <g clip-path="url(#frame)"><rect y="352" width="1200" height="8" fill="url(#bar)"/></g>
</svg>
