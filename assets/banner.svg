<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">Nicolas Alkhoury</title>
  <desc id="d">Full-Stack Developer and AI Toolmaker based in Ottawa, Canada.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0C0C"/>
      <stop offset="0.6" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#333333"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A1A1A1"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#636363"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A3A3A"/>
      <stop offset="0.5" stop-color="#D1D1D1"/>
      <stop offset="1" stop-color="#3A3A3A"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>
  <style>
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    .f1 { animation: float 9s ease-in-out infinite; }
    .f2 { animation: float 12s ease-in-out infinite reverse; }
    .tw { animation: twinkle 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .f1, .f2, .tw { animation: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#dots)"/>
    <circle class="f1" cx="1030" cy="60" r="240" fill="url(#glowA)"/>
    <circle class="f2" cx="90" cy="350" r="220" fill="url(#glowB)"/>
    <text x="1150" y="270" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="200" font-weight="800" fill="#ffffff" fill-opacity="0.045">&lt;/&gt;</text>

    <circle cx="140" cy="180" r="74" fill="none" stroke="url(#ring)" stroke-width="3"/>
    <circle cx="140" cy="180" r="62" fill="#0C0C0C"/>
    <text x="140" y="203" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#name)">N</text>
    <circle class="tw" cx="205" cy="128" r="5" fill="#D1D1D1"/>

    <text x="250" y="116" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#8E8E8E">HELLO, I'M</text>
    <text x="250" y="180" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="60" font-weight="800" fill="url(#name)">Nicolas Alkhoury</text>
    <text x="250" y="224" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="27" font-weight="600" fill="#D1D1D1">Full-Stack Developer • AI Toolmaker</text>
    <text x="250" y="264" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" fill="#8E8E8E">Web apps end to end — front end, back end, and the AI in between.</text>

    <rect x="250" y="288" width="176" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#636363"/>
    <circle class="tw" cx="272" cy="305" r="4.5" fill="#D1D1D1"/>
    <text x="288" y="310" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#F0F0F0">Ottawa, Canada</text>

    <rect y="352" width="1200" height="8" fill="url(#bar)"/>
  </g>
</svg>
